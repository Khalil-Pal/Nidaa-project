$kind: http-request
name: View Help Request Assignment History
description: >-
  Returns the full assignment history for one humanitarian help request. Set
  helpRequestId to a request owned by the logged-in beneficiary, assigned
  helper, or use an admin token.
url: http://localhost:8081/api/v1/assignments/help-requests/{{helpRequestId}}
method: GET
auth:
  type: bearer
  credentials:
    token: "{{beneficiaryToken}}"
order: 4520000000000002
