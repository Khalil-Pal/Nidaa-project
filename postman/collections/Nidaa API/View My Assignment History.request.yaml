$kind: http-request
name: View My Assignment History
description: >-
  Returns assignment history visible to the logged-in account. Beneficiaries
  receive assignments for their requests; helpers receive assignments made to
  them; admins receive all assignments.
url: http://localhost:8081/api/v1/assignments/my
method: GET
auth:
  type: bearer
  credentials:
    token: "{{beneficiaryToken}}"
order: 4520000000000001
