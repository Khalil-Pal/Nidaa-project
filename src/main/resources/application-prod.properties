# Production profile (DEP-6): --spring.profiles.active=prod, or SPRING_PROFILES_ACTIVE=prod
# (docker-compose.yml sets it). Contains no secrets; those come from the environment.

# No SQL on the console or in the log file. Statement logging belongs to development only.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Error responses never include the stack trace or the exception message
# (GlobalExceptionHandler already returns a reference instead of the text).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Logging levels for prod are in logback-spring.xml (<springProfile name="prod">).
